name: Send Hanoi House Price

on:
  schedule:
    # Every 3 hours (UTC). Listings change slowly and each run takes ~12
    # minutes of scraping, so every 30 minutes mostly repeated the same data.
    - cron: "7 */3 * * *"
  workflow_dispatch: {}

# Each job asks for what it needs. The AI review reads seller-written
# listing text, so it runs in its own job with no token permissions, no
# checkout and its shell/write/web tools denied - see the ai-review job.
permissions: {}

jobs:
  # Phase 1 (was "generate"): fetch listings, apply rule-based filters,
  # write email/listings.json + email/ai_prompt.txt
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      PYTHONUTF8: "1"
      LANG: "en_US.UTF-8"
      LC_ALL: "en_US.UTF-8"
    steps:
      - name: Check out repo
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade certifi
          pip install -r requirements.txt

      - name: Prepare listings
        env:
          SEND_ONLY_ON_CHANGE: "false"
          TIMEZONE: "Asia/Ho_Chi_Minh"
        run: python hanoi_house_price_emailer.py prepare

      - name: Upload listings
        uses: actions/upload-artifact@v7
        with:
          name: listings
          path: email/listings.json
          if-no-files-found: error
          retention-days: 1
          overwrite: true  # lets "Re-run jobs" upload again

      - name: Upload AI prompt
        uses: actions/upload-artifact@v7
        with:
          name: ai-prompt
          path: email/ai_prompt.txt
          if-no-files-found: error
          retention-days: 1
          overwrite: true  # lets "Re-run jobs" upload again

  # Phase 2: AI review of listings.json via Copilot CLI, called
  # directly (NOT via actions/ai-inference - that action proved
  # unreliable: @v1 is stale/hardcodes the retired GitHub Models
  # endpoint, and @main gave inconsistent results). This mirrors
  # GitHub's own documented direct-CLI usage instead.
  # See: https://docs.github.com/copilot/how-tos/copilot-cli/use-copilot-cli-in-actions
  #
  # The prompt includes text written by sellers, so treat it as hostile:
  # this job gets no GITHUB_TOKEN permissions and no checkout (nothing to
  # push, no git credentials on disk), and the CLI runs from an empty
  # directory with shell, file-write and URL tools denied. It only has to
  # answer with text; the build step validates that answer.
  ai-review:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions: {}
    steps:
      - name: Download AI prompt
        uses: actions/download-artifact@v7
        with:
          name: ai-prompt
          path: ${{ runner.temp }}/ai-in

      - name: Set up Node.js
        uses: actions/setup-node@v7

      # Pinned to an exact version so a new release can't change what runs
      # here with the PAT in scope. Bump deliberately.
      - name: Install Copilot CLI
        run: npm install -g @github/copilot@1.0.88

      - name: AI review listings
        continue-on-error: true  # fails open - build step handles a missing/bad response gracefully
        env:
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_PAT }}
          AI_IN: ${{ runner.temp }}/ai-in
          AI_OUT: ${{ runner.temp }}/ai-out
          AI_CWD: ${{ runner.temp }}/ai-cwd
        # No --yolo / --allow-all-tools: in -p mode any tool request that
        # isn't allowed is auto-denied, and the explicit --deny-tool rules
        # win over any allow rule. Reads are limited to the (empty) working
        # directory.
        run: |
          mkdir -p "$AI_OUT" "$AI_CWD"
          cd "$AI_CWD"
          copilot -p "$(cat "$AI_IN/ai_prompt.txt")" \
            --silent --no-color --no-auto-update \
            --deny-tool=shell --deny-tool=write --deny-tool=url \
            --disallow-temp-dir --disable-builtin-mcps \
            --no-custom-instructions --no-ask-user \
            > "$AI_OUT/ai_response.json"
          echo "--- raw Copilot CLI output (for debugging) ---"
          # Model output is untrusted: don't let it issue ::workflow commands::
          stop="$(cat /proc/sys/kernel/random/uuid)"
          echo "::stop-commands::$stop"
          cat "$AI_OUT/ai_response.json"
          echo
          echo "::$stop::"

      - name: Upload AI response
        uses: actions/upload-artifact@v7
        with:
          name: ai-response
          path: ${{ runner.temp }}/ai-out/ai_response.json
          if-no-files-found: ignore
          retention-days: 1
          overwrite: true  # lets "Re-run jobs" upload again

  send:
    needs: [prepare, ai-review]
    # The AI review is optional: still build and send if it failed or was
    # skipped, as long as prepare produced the listings.
    if: ${{ !cancelled() && needs.prepare.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      # Without the Gmail secrets, the Send step is skipped (with a warning)
      # instead of failing the run every time.
      HAS_GMAIL: ${{ secrets.GMAIL_ADDRESS != '' && secrets.GMAIL_APP_PASSWORD != '' }}
      PYTHONUTF8: "1"
      LANG: "en_US.UTF-8"
      LC_ALL: "en_US.UTF-8"
    steps:
      - name: Check out repo
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade certifi
          pip install -r requirements.txt

      - name: Restore dedup state
        run: |
          git fetch origin house-price-state 2>/dev/null && \
            git show origin/house-price-state:state/last_price.json > /tmp/last_price.json 2>/dev/null || true
          mkdir -p state
          if [ -s /tmp/last_price.json ]; then
            cp /tmp/last_price.json state/last_price.json
            echo "Restored previous state."
          else
            echo "No previous state found - first run."
          fi

      - name: Download listings
        uses: actions/download-artifact@v7
        with:
          name: listings
          path: email

      # Absent when the AI review failed or was skipped.
      - name: Download AI response
        continue-on-error: true
        uses: actions/download-artifact@v7
        with:
          name: ai-response
          path: email

      # Phase 3 (new): apply the AI verdict (if ai_response.json exists -
      # if the AI step failed/was skipped, build falls back to the
      # rule-based filters alone rather than blocking the email)
      - name: Build email
        env:
          SEND_ONLY_ON_CHANGE: "false"
          TIMEZONE: "Asia/Ho_Chi_Minh"
        run: python hanoi_house_price_emailer.py build

      # Publish docs/index.html to main so GitHub Pages serves the latest
      # listings (with reliably-working images, unlike inline email
      # images) - mirrors the same pattern already proven in
      # tuongphanbase/currency-rate-emailer's workflow. Must run BEFORE
      # sending, since the email links to this page and the link should
      # already be live. continue-on-error so a git hiccup here can't
      # block the email itself - worst case the page link is briefly
      # stale until the next successful run.
      - name: Publish GitHub Page
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Update listings page [skip ci]"
            git pull --rebase origin main
            git push origin main
            sleep 30
          fi

      - name: Warn that the Gmail secrets are missing
        if: env.HAS_GMAIL != 'true'
        run: echo "::warning::GMAIL_ADDRESS / GMAIL_APP_PASSWORD secrets are not set, so no email was sent. Add them in Settings -> Secrets and variables -> Actions."

      - name: Send email
        if: env.HAS_GMAIL == 'true'
        env:
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          HOUSE_RECIPIENT: ${{ secrets.HOUSE_RECIPIENT }}
        run: python hanoi_house_price_emailer.py send

      - name: Persist dedup state
        # Only remember items as sent if the email actually went out.
        if: env.HAS_GMAIL == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          cp state/last_price.json /tmp/last_price.json
          git checkout --orphan house-price-state-new
          git reset --hard
          mkdir -p state
          cp /tmp/last_price.json state/last_price.json
          git add -f state/last_price.json
          git commit -m "Update dedup state" || echo "Nothing to commit"
          git branch -f house-price-state house-price-state-new
          git push origin house-price-state --force
